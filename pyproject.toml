[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lablive"
version = "0.9.0b7"
description = "Keithley 2400 + Newport 1936-R LED drive / photocurrent stability monitor"
requires-python = ">=3.9"
dependencies = ["pyserial>=3.4", "numpy>=1.21", "matplotlib>=3.6"]

[project.scripts]
led-live = "lablive.cli.live:entry"
led-iv = "lablive.cli.iv:entry"
led-profile = "lablive.cli.profile:entry"
led-check = "lablive.cli.check:entry"
led-gui = "lablive.cli.gui:entry"
led-pulses = "lablive.cli.pulses:entry"
lablive-selftest = "lablive.cli.selftest:entry"

[tool.setuptools]
packages = ["lablive", "lablive.cli"]
